# This file goes in the PUBLIC runner repo as .github/workflows/run.yml.
# It downloads the private gta6-shorts code with a read/write token and runs it.
# Run pages of a public repo are visible to anyone, so the app runs silently
# (LOG_LEVEL=CRITICAL) and all details go to Telegram.
name: run

# GitHub often starts scheduled runs late or skips them, so a run that starts
# near an upload slot keeps looping (a cycle every 10 minutes) until the day's
# slots are done or ~5 hours pass. Any one schedule that fires covers the rest.
# Daily and weekly reports are sent from inside the cycle.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run, daily, weekly, status, resume, telegram-test, preview [clip id]"
        default: run

# Read-only commands get their own group so they don't wait behind a long run
# and never write the saved state.
concurrency:
  group: ${{ (inputs.command == 'status' || startsWith(inputs.command, 'preview')) && 'gta6-readonly' || 'gta6-shorts' }}
  cancel-in-progress: false

permissions:
  contents: write   # only for the weekly keep-alive commit in this runner repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Get the private code
        uses: actions/checkout@v4
        with:
          repository: Mitsaras32/gta6-shorts
          token: ${{ secrets.GTA6_REPO_TOKEN }}
          path: app

      - name: Load saved state
        run: bash app/scripts/state.sh load > /dev/null 2>&1 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install ffmpeg and packages
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
          pip install -q -r app/requirements.txt > /dev/null 2>&1

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Run
        env:
          LOG_LEVEL: CRITICAL
          PYTHONPATH: src
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_COMMAND: ${{ inputs.command }}
          GTA6_REPO_TOKEN: ${{ secrets.GTA6_REPO_TOKEN }}
        run: |
          cd app
          CMD=run
          [ -n "$INPUT_COMMAND" ] && CMD="$INPUT_COMMAND"
          set -- $CMD
          case "$1" in run|daily|weekly|status|resume|telegram-test|preview) ;; *) echo "unknown command"; exit 1 ;; esac
          if [ "$1" != run ]; then
            python -m gta6shorts "$@"
            exit $?
          fi
          end=$((SECONDS + 300 * 60))
          while :; do
            python -m gta6shorts run || true
            bash scripts/state.sh save > /dev/null 2>&1 || echo "state save failed"
            [ $SECONDS -ge $end ] && break
            python -m gta6shorts keep-running || break
            echo "slot open or coming up, next cycle in 10 minutes"
            sleep 600
          done

      - name: Save state
        if: always() && inputs.command != 'status' && !startsWith(inputs.command, 'preview')
        env:
          GTA6_REPO_TOKEN: ${{ secrets.GTA6_REPO_TOKEN }}
        run: bash app/scripts/state.sh save > /dev/null 2>&1

      # GitHub switches off schedules in public repos after 60 days without commits.
      # Writes the week number, so it commits at most once a week.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          git clone -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" keep > /dev/null 2>&1
          cd keep
          date -u +%G-W%V > .keepalive
          git add .keepalive
          git -c user.name="gta6-bot" -c user.email="gta6-bot@users.noreply.github.com" commit -q -m "keep alive" || exit 0
          git push -q > /dev/null 2>&1
